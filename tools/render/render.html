<!doctype html>
<html>
<head><meta charset="utf-8"><title>Iron Sentinel sprite renderer</title></head>
<body style="margin:0;background:#777">
<!--
  Offline sprite renderer for Meshy GLB models (driven by tools/render/render.mjs via Playwright).
  Camera = the game's isometric projection: orthographic, 45° azimuth, 30° elevation
  (a 1x1 ground tile becomes a 2:1 diamond). Towers are split at a cut height into a static
  base and a rotating turret; units are rendered in N directions.
-->
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.localClippingEnabled = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

// light from screen upper-left (= world -X), warm key + cool rim + hemisphere fill
const key = new THREE.DirectionalLight(0xffeedd, 2.7);
key.position.set(-5, 7, 1.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -3; key.shadow.camera.right = 3; key.shadow.camera.top = 3; key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.DirectionalLight(0xb8d0ff, 1.1);
rim.position.set(-3, 4, -5);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xffd2a8, 0.45);
fill.position.set(4, 3, 4);
scene.add(fill);
scene.add(new THREE.HemisphereLight(0xcfdcff, 0x3a2c20, 0.55));

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 200);
const EL = Math.PI / 6, AZ = Math.PI / 4;
const D = new THREE.Vector3(Math.cos(EL) * Math.sin(AZ), Math.sin(EL), Math.cos(EL) * Math.cos(AZ));
camera.position.copy(D).multiplyScalar(50);
camera.up.set(0, 1, 0);
camera.lookAt(0, 0, 0);
camera.updateMatrixWorld();

const loader = new GLTFLoader();
let current = null;

function collectVerts(root, filter) {
  const out = [];
  const v = new THREE.Vector3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!o.isMesh) return;
    const pos = o.geometry.attributes.position;
    const step = Math.max(1, Math.floor(pos.count / 6000));
    for (let i = 0; i < pos.count; i += step) {
      if (o.isSkinnedMesh) { o.getVertexPosition(i, v); v.applyMatrix4(o.matrixWorld); }
      else v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      if (!filter || filter(v)) out.push(v.clone());
    }
  });
  return out;
}

window.renderModel = async function (opt) {
  // opt: {url, mode:'tower'|'unit', frames, size, byHeight, cut, yaw0 (deg, model forward angle), muzzle:[x,y,z]|null, P, pad}
  if (current) { scene.remove(current.pivot); }
  const gltf = await loader.loadAsync(opt.url);
  const model = gltf.scene;
  model.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) { if (m.map) m.map.anisotropy = 8; m.envMapIntensity = 1.0; }
    }
  });
  // normalise: feet at y=0; towers are centred + scaled on their base footprint (the turret axis),
  // units on their full bounding box
  model.updateMatrixWorld(true);
  const pts0 = collectVerts(model);
  let box = new THREE.Box3().setFromPoints(pts0);
  const sz = box.getSize(new THREE.Vector3());
  let ref = box;
  if (opt.mode === 'tower') {
    const lowV = collectVerts(model, (v) => v.y < box.min.y + sz.y * (opt.baseFrac ?? 0.25));
    ref = new THREE.Box3().setFromPoints(lowV);
  }
  const rs = ref.getSize(new THREE.Vector3());
  const s = opt.byHeight ? opt.size / sz.y : opt.size / Math.max(rs.x, rs.z);
  const rc = ref.getCenter(new THREE.Vector3());
  model.scale.setScalar(s);
  model.position.set(-rc.x * s, -box.min.y * s, -rc.z * s);
  if (opt.offset) { model.position.x += opt.offset[0]; model.position.z += opt.offset[1]; }
  const inner = new THREE.Group(); inner.add(model);
  const pivot = new THREE.Group(); pivot.add(inner);
  scene.add(pivot);
  current = { pivot };
  // optional walk cycle (rigged Meshy GLB): sample the first clip, keep the hips in place
  let mixer = null, clip = null, hips = null, hips0 = null, animYaw = null, rootVec = null, autoCutFrac = null;
  if (opt.anim && gltf.animations.length) {
    clip = gltf.animations[0];
    mixer = new THREE.AnimationMixer(model);
    mixer.clipAction(clip).play();
    mixer.setTime(0);
    model.traverse((o) => { if (!hips && o.isBone && /hip|pelvis/i.test(o.name)) hips = o; });
    if (!hips) model.traverse((o) => { if (!hips && o.isBone) hips = o; });
    pivot.updateMatrixWorld(true);
    hips0 = hips.getWorldPosition(new THREE.Vector3());
    // facing from the skeleton: average ankle -> toe direction of both feet
    const bone = (re) => { let b = null; model.traverse((o) => { if (!b && o.isBone && re.test(o.name)) b = o; }); return b; };
    const pairs = [[/LeftFoot$/i, /LeftToe/i], [/RightFoot$/i, /RightToe/i]];
    let fx = 0, fz = 0;
    for (const [fa, ta] of pairs) {
      const f = bone(fa), t = bone(ta);
      if (!f || !t) continue;
      const a = f.getWorldPosition(new THREE.Vector3()), b = t.getWorldPosition(new THREE.Vector3());
      fx += b.x - a.x; fz += b.z - a.z;
    }
    const footYaw = (fx || fz) ? Math.atan2(fz, fx) : null;
    if (opt.autoFacing && footYaw !== null) animYaw = footYaw;
    // root motion over one clip = walking direction and stride length (normalised units = map cells)
    mixer.setTime(clip.duration * 0.999);
    pivot.updateMatrixWorld(true);
    const hEnd = hips.getWorldPosition(new THREE.Vector3());
    mixer.setTime(0);
    pivot.updateMatrixWorld(true);
    rootVec = [hEnd.x - hips0.x, hEnd.z - hips0.z];
    if (opt.anim.rootFacing && Math.hypot(...rootVec) > 0.05) animYaw = Math.atan2(rootVec[1], rootVec[0]);
    else if (opt.anim.rootFacing) {
      // in-place cycle: the feet swing along the walking axis (principal axis of their path);
      // a planted foot slides back by half the distance covered per cycle
      const fb = [bone(/LeftFoot$/i), bone(/RightFoot$/i)].filter(Boolean);
      const tr = fb.map(() => []);
      for (let k = 0; k < 48; k++) {
        mixer.setTime(clip.duration * k / 48); pivot.updateMatrixWorld(true);
        fb.forEach((b, j) => { const p = b.getWorldPosition(new THREE.Vector3()); tr[j].push([p.x, p.z]); });
      }
      let sxx = 0, szz = 0, sxz = 0, n = 0;
      for (const t of tr) {
        const mx = t.reduce((a, p) => a + p[0], 0) / t.length, mz = t.reduce((a, p) => a + p[1], 0) / t.length;
        for (const p of t) { sxx += (p[0] - mx) ** 2; szz += (p[1] - mz) ** 2; sxz += (p[0] - mx) * (p[1] - mz); n++; }
      }
      let ax = 0.5 * Math.atan2(2 * sxz, sxx - szz);           // principal axis (undirected)
      const base = THREE.MathUtils.degToRad(opt.yaw0 ?? 90);
      if (Math.cos(ax - base) < 0) ax += Math.PI;               // pick the end closest to the known forward
      animYaw = ax;
      const ranges = tr.map(t => { const pr = t.map(p => p[0] * Math.cos(ax) + p[1] * Math.sin(ax)); return Math.max(...pr) - Math.min(...pr); });
      const d = ranges.reduce((a, b) => a + b, 0) / ranges.length;
      rootVec = [Math.cos(ax) * 2 * d, Math.sin(ax) * 2 * d];
      mixer.setTime(0); pivot.updateMatrixWorld(true);
      console.log('walk axis', (ax * 180 / Math.PI).toFixed(1), 'foot range', d.toFixed(3));
    }
    console.log('root motion', rootVec.map(v => v.toFixed(3)).join(','), 'yaw', (Math.atan2(rootVec[1], rootVec[0]) * 180 / Math.PI).toFixed(1));
    console.log('feet point to (deg)', footYaw === null ? 'n/a' : (footYaw * 180 / Math.PI).toFixed(0));
  }
  let legs = null;
  if (opt.legs) {
    pivot.updateMatrixWorld(true);
    const L = opt.legs, fwdA = THREE.MathUtils.degToRad(opt.yaw0 ?? 90);
    const fwd = new THREE.Vector3(Math.cos(fwdA), 0, Math.sin(fwdA)), up = new THREE.Vector3(0, 1, 0);
    let rMax = 0;
    const meshes = [];
    model.traverse((o) => { if (o.isMesh) meshes.push(o); });
    const v = new THREE.Vector3();
    for (const o of meshes) { const pa = o.geometry.attributes.position; for (let i = 0; i < pa.count; i += 7) { v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld); rMax = Math.max(rMax, Math.hypot(v.x, v.z)); } }
    const r0 = rMax * (L.r0 ?? 0.42);
    // leg directions: k-means on the angle of the outer vertices
    let yMax = 0;
    for (const o of meshes) { const pa = o.geometry.attributes.position; for (let i = 0; i < pa.count; i += 7) { v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld); yMax = Math.max(yMax, v.y); } }
    const outer = [];   // feet: outer vertices close to the ground
    for (const o of meshes) { const pa = o.geometry.attributes.position; for (let i = 0; i < pa.count; i += 3) { v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld); if (Math.hypot(v.x, v.z) > r0 && v.y < yMax * (L.footH ?? 0.22)) outer.push(Math.atan2(v.z, v.x)); } }
    // init: histogram peaks of the foot angles
    const H = new Array(72).fill(0);
    for (const a of outer) H[((Math.floor((a + Math.PI) / (2 * Math.PI) * 72) % 72) + 72) % 72]++;
    const sm = H.map((_, i) => H[(i + 71) % 72] + 2 * H[i] + H[(i + 1) % 72]);
    const peaks = [];
    const used = new Array(72).fill(false);
    for (let k = 0; k < L.n; k++) {
      let bi = -1, bv = -1;
      for (let i = 0; i < 72; i++) if (!used[i] && sm[i] > bv) { bv = sm[i]; bi = i; }
      peaks.push((bi + 0.5) / 72 * 2 * Math.PI - Math.PI);
      for (let d = -5; d <= 5; d++) used[(bi + d + 72) % 72] = true;   // suppress ±25°
    }
    let cent = peaks;
    for (let it = 0; it < 12; it++) {
      const sx = new Array(L.n).fill(0), sz = new Array(L.n).fill(0);
      for (const a of outer) {
        let b = 0, bd = 9;
        for (let k = 0; k < L.n; k++) { const d = Math.abs(Math.atan2(Math.sin(a - cent[k]), Math.cos(a - cent[k]))); if (d < bd) { bd = d; b = k; } }
        sx[b] += Math.cos(a); sz[b] += Math.sin(a);
      }
      cent = cent.map((c, k) => (sx[k] || sz[k]) ? Math.atan2(sz[k], sx[k]) : c);
    }
    // gait groups: alternate around the circle (diagonal pairs for 4 legs, tripods for 6)
    const order = cent.map((c, k) => [Math.atan2(Math.sin(c - fwdA), Math.cos(c - fwdA)), k]).sort((a, b) => a[0] - b[0]);
    const group = new Array(L.n); order.forEach(([, k], i) => { group[k] = i % 2; });
    const S = (L.stride ?? 0.1) * rMax, Hl = (L.lift ?? 0.07) * rMax;
    legs = { meshes: [], S, Hl, bob: (L.bob ?? 0.012) * rMax };
    // quadrupeds / bipeds (L.mode 'quad' | 'biped'): the legs hang below the body instead of spreading out, so
    // they are found by height (weight 1 at the ground, 0 at the hip) and grouped by quadrant / side:
    // diagonal pairs trot together (quad), left and right alternate (biped)
    const quad = L.mode === 'quad' || L.mode === 'biped';
    let fc = 0, sc = 0;
    const side = new THREE.Vector3(-fwd.z, 0, fwd.x);
    if (quad) {
      const fs = [], ss = [];
      for (const o of meshes) { const pa = o.geometry.attributes.position; for (let i = 0; i < pa.count; i += 5) { v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld); if (v.y < yMax * 0.15) { fs.push(v.dot(fwd)); ss.push(v.dot(side)); } } }
      fs.sort((a, b) => a - b); ss.sort((a, b) => a - b);
      fc = fs[fs.length >> 1] || 0; sc = ss[ss.length >> 1] || 0;
    }
    const hipH = yMax * (L.hip ?? 0.45);
    const inv = new THREE.Matrix3();
    for (const o of meshes) {
      const pa = o.geometry.attributes.position;
      const orig = pa.array.slice();
      inv.setFromMatrix4(o.matrixWorld).invert();
      const fl = fwd.clone().applyMatrix3(inv), ul = up.clone().applyMatrix3(inv);
      const w = new Float32Array(pa.count), g = new Uint8Array(pa.count);
      for (let i = 0; i < pa.count; i++) {
        v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld);
        if (quad) {
          let q = Math.min(1, Math.max(0, (hipH - v.y) / hipH));
          w[i] = q * q * (3 - 2 * q);
          const left = v.dot(side) > sc, front = v.dot(fwd) > fc;
          g[i] = L.mode === 'biped' ? (left ? 1 : 0) : (left !== front ? 1 : 0);
          continue;
        }
        const r = Math.hypot(v.x, v.z);
        w[i] = Math.min(1, Math.max(0, (r - r0) / (rMax - r0)));
        w[i] = w[i] * w[i] * (3 - 2 * w[i]);
        const a = Math.atan2(v.z, v.x);
        let b = 0, bd = 9;
        for (let k = 0; k < L.n; k++) { const d = Math.abs(Math.atan2(Math.sin(a - cent[k]), Math.cos(a - cent[k]))); if (d < bd) { bd = d; b = k; } }
        g[i] = group[b];
      }
      legs.meshes.push({ o, orig, fl, ul, w, g });
    }
    rootVec = [Math.cos(fwdA) * 4 * S, Math.sin(fwdA) * 4 * S];   // planted feet: body moves 4·S per cycle
    if (quad) console.log('legs', L.mode, 'fc', fc.toFixed(3), 'sc', sc.toFixed(3), 'hip', hipH.toFixed(3)); else console.log('legs', L.n, 'centres', cent.map(c => (c * 180 / Math.PI).toFixed(0)).join(','), 'groups', group.join(''));
  }
  // procedural deformations for unrigged hovering creatures (opt.deform):
  //  'wings' - everything beyond the wing root (lateral distance r0) hinges up and down around it, the body bobs
  //  'robe'  - the lower part of a robe / ghost tail ripples with a wave that runs downwards
  let deform = null;
  if (opt.deform) {
    pivot.updateMatrixWorld(true);
    const D = opt.deform, fwdA = THREE.MathUtils.degToRad(opt.yaw0 ?? 90);
    const fwd = new THREE.Vector3(Math.cos(fwdA), 0, Math.sin(fwdA)), up = new THREE.Vector3(0, 1, 0), side = new THREE.Vector3(-fwd.z, 0, fwd.x);
    const meshes = [];
    model.traverse((o) => { if (o.isMesh) meshes.push(o); });
    const v = new THREE.Vector3();
    let yMin = Infinity, yMax = -Infinity, sMax = 0;
    for (const o of meshes) { const pa = o.geometry.attributes.position; for (let i = 0; i < pa.count; i += 3) { v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld); yMin = Math.min(yMin, v.y); yMax = Math.max(yMax, v.y); sMax = Math.max(sMax, Math.abs(v.dot(side))); } }
    const Hh = yMax - yMin, r0 = sMax * (D.r0 ?? 0.3);
    deform = { D, meshes: [], Hh, sMax, r0, yMin };
    const inv = new THREE.Matrix3();
    for (const o of meshes) {
      const pa = o.geometry.attributes.position;
      inv.setFromMatrix4(o.matrixWorld).invert();
      const s0 = new Float32Array(pa.count), y0 = new Float32Array(pa.count);
      for (let i = 0; i < pa.count; i++) { v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld); s0[i] = v.dot(side); y0[i] = v.y - yMin; }
      deform.meshes.push({ o, orig: pa.array.slice(), fl: fwd.clone().applyMatrix3(inv), ul: up.clone().applyMatrix3(inv), sl: side.clone().applyMatrix3(inv), s0, y0 });
    }
    console.log('deform', D.mode, 'H', Hh.toFixed(3), 'sMax', sMax.toFixed(3));
  }
  const deformPose = (ph) => {
    const { D, Hh, sMax, r0 } = deform, TAU = Math.PI * 2;
    const th = (D.amp ?? 0.5) * Math.sin(TAU * ph);                    // wing angle
    const bob = (D.bob ?? 0.02) * Hh * Math.sin(TAU * ph + Math.PI);
    for (const m of deform.meshes) {
      const pa = m.o.geometry.attributes.position, a = pa.array;
      for (let i = 0; i < pa.count; i++) {
        let df = 0, ds = 0, dy = bob;
        const s = m.s0[i], y = m.y0[i];
        if (D.mode === 'wings') {
          const as = Math.abs(s);
          if (as > r0 && y > Hh * (D.minY ?? 0.3)) {
            let w = Math.min(1, (as - r0) / Math.max(1e-6, (sMax - r0) * 0.35)); w = w * w * (3 - 2 * w);
            const d = as - r0;
            dy += w * d * Math.sin(th);
            ds += w * d * (Math.cos(th) - 1) * Math.sign(s);
          }
        } else if (D.mode === 'robe') {
          const yc = Hh * (D.h ?? 0.55);
          if (y < yc) {
            const w = Math.pow((yc - y) / yc, 1.5);
            const phs = TAU * ph - (y / Hh) * TAU * 1.2 + (s / Math.max(1e-6, sMax)) * 1.5;
            df = (D.amp ?? 0.05) * Hh * w * Math.sin(phs);
            ds = (D.amp ?? 0.05) * 0.7 * Hh * w * Math.cos(phs * 0.9 + 0.7);
          }
        }
        a[3 * i] = m.orig[3 * i] + m.fl.x * df + m.sl.x * ds + m.ul.x * dy;
        a[3 * i + 1] = m.orig[3 * i + 1] + m.fl.y * df + m.sl.y * ds + m.ul.y * dy;
        a[3 * i + 2] = m.orig[3 * i + 2] + m.fl.z * df + m.sl.z * ds + m.ul.z * dy;
      }
      pa.needsUpdate = true;
      m.o.geometry.computeBoundingSphere();
    }
  };
  const legPose = (ph) => {
    for (const m of legs.meshes) {
      const pa = m.o.geometry.attributes.position, a = pa.array;
      const bob = legs.bob * Math.abs(Math.sin(ph * 4 * Math.PI));
      for (let i = 0; i < pa.count; i++) {
        const p = (ph + m.g[i] * 0.5) % 1;
        const st = legs.S * Math.cos(2 * Math.PI * p);                // stance p<0.5: front -> back
        const li = p >= 0.5 ? legs.Hl * Math.sin(2 * Math.PI * (p - 0.5)) : 0;
        const w = m.w[i], k = w * st, h = w * li + (1 - w) * bob;
        a[3 * i] = m.orig[3 * i] + m.fl.x * k + m.ul.x * h;
        a[3 * i + 1] = m.orig[3 * i + 1] + m.fl.y * k + m.ul.y * h;
        a[3 * i + 2] = m.orig[3 * i + 2] + m.fl.z * k + m.ul.z * h;
      }
      pa.needsUpdate = true;
      m.o.geometry.computeBoundingSphere();
    }
  };
  const pose = (t) => {
    if (legs) { legPose(t); return; }
    if (deform) { deformPose(t); return; }
    if (!mixer) return;
    mixer.setTime(t);
    inner.position.set(0, 0, 0);
    pivot.updateMatrixWorld(true);
    const hp = hips.getWorldPosition(new THREE.Vector3());
    // cancel root motion in the horizontal plane (pivot rotation applies afterwards)
    const local = new THREE.Vector3(hp.x - hips0.x, 0, hp.z - hips0.z).applyAxisAngle(new THREE.Vector3(0, 1, 0), -pivot.rotation.y);
    inner.position.set(-local.x, 0, -local.z);
    pivot.updateMatrixWorld(true);
  };
  pivot.updateMatrixWorld(true);
  box = new THREE.Box3().setFromPoints(collectVerts(pivot));
  const H = box.max.y;

  const N = opt.frames || 16;
  let cutY = opt.mode === 'tower' ? H * (typeof opt.cut === 'number' ? opt.cut : 0.45) : null;
  if (opt.mode === 'tower' && opt.cut === 'auto') {
    // turret ring = narrowest horizontal slice between the base and the weapon (smoothed radius profile)
    const B = 60, prof = new Array(B).fill(0);
    for (const v of collectVerts(pivot)) { const k = Math.min(B - 1, Math.max(0, Math.floor(v.y / H * B))); prof[k] = Math.max(prof[k], Math.hypot(v.x, v.z)); }
    const sm = prof.map((_, i) => { let a = 0, n = 0; for (let d = -1; d <= 1; d++) if (prof[i + d] != null) { a += prof[i + d]; n++; } return a / n; });
    let bi = -1, bv = 1e9;
    for (let i = Math.floor(B * (opt.cutMin ?? 0.22)); i <= Math.floor(B * (opt.cutMax ?? 0.62)); i++) if (sm[i] > 0 && sm[i] < bv) { bv = sm[i]; bi = i; }
    cutY = H * (bi + 0.5) / B;
    console.log('auto cut', ((bi + 0.5) / B).toFixed(3), 'profile', sm.map(v => v.toFixed(2)).join(' '));
    autoCutFrac = (bi + 0.5) / B;
  }

  // auto-detect forward direction / muzzle for turrets (farthest vertex from the axis above the cut)
  let yaw0 = animYaw ?? (opt.yaw0 != null ? THREE.MathUtils.degToRad(opt.yaw0) : null);
  let muzzle = opt.muzzle ? new THREE.Vector3(...opt.muzzle) : null;
  let autoInfo = null;
  if (opt.mode === 'tower') {
    const vs = collectVerts(pivot, (v) => v.y >= cutY);
    let best = null, br = -1;
    for (const v of vs) { const r = Math.hypot(v.x, v.z); if (r > br) { br = r; best = v; } }
    autoInfo = { yaw: THREE.MathUtils.radToDeg(Math.atan2(best.z, best.x)), tip: [best.x, best.y, best.z], r: br };
    if (yaw0 == null) yaw0 = Math.atan2(best.z, best.x);
    if (!muzzle) {
      // average of vertices near the tip along the forward direction
      const fx = Math.cos(yaw0), fz = Math.sin(yaw0);
      let maxA = -1e9;
      for (const v of vs) maxA = Math.max(maxA, v.x * fx + v.z * fz);
      const near = vs.filter((v) => v.x * fx + v.z * fz > maxA - 0.04);
      const m = new THREE.Vector3();
      for (const v of near) m.add(v);
      muzzle = m.multiplyScalar(1 / near.length);
    }
  }
  if (yaw0 == null) yaw0 = Math.PI / 4;

  // frame bounds over all rotations (view space)
  const view = camera.matrixWorldInverse;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  const allV = collectVerts(pivot);
  // static props also bake a ground shadow: include the projection of every vertex along the key light
  const Ld = key.position.clone().normalize();
  if (opt.shadow) {
    const n0 = allV.length;
    for (let i = 0; i < n0; i += 2) { const v = allV[i]; allV.push(new THREE.Vector3(v.x - Ld.x * v.y / Ld.y, 0, v.z - Ld.z * v.y / Ld.y)); }
  }
  for (let i = 0; i < N; i++) {
    const rot = new THREE.Matrix4().makeRotationY(-(2 * Math.PI * i / N));
    for (const v of allV) {
      const p = v.clone().applyMatrix4(rot).applyMatrix4(view);
      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
    }
  }
  const pad = opt.pad ?? 0.03;
  minX -= pad; maxX += pad; minY -= pad; maxY += pad;
  const P = opt.P;
  const W = Math.ceil((maxX - minX) * P), Hh = Math.ceil((maxY - minY) * P);
  maxX = minX + W / P; minY = maxY - Hh / P;
  renderer.setSize(W, Hh, false);
  camera.left = minX; camera.right = maxX; camera.top = maxY; camera.bottom = minY;
  camera.updateProjectionMatrix();
  const toPx = (p) => {
    const q = p.clone().applyMatrix4(view);
    return [(q.x - minX) * P, (maxY - q.y) * P];
  };
  const anchor = toPx(new THREE.Vector3(0, 0, 0));

  const setClip = (planes) => {
    model.traverse((o) => {
      if (!o.isMesh) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) { m.clippingPlanes = planes; m.side = planes.length ? THREE.DoubleSide : THREE.FrontSide; m.needsUpdate = true; }
    });
  };
  const shot = () => { renderer.render(scene, camera); return renderer.domElement.toDataURL('image/png'); };

  // shadow-only passes: ground catcher + invisible model; key-light shadow and a contact shadow from above
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 1 }));
  plane.rotation.x = -Math.PI / 2; plane.position.y = 0.001; plane.receiveShadow = true;
  const setColor = (on) => model.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of (Array.isArray(o.material) ? o.material : [o.material])) { m.colorWrite = on; m.depthWrite = on; }
  });
  const shadowShots = () => {
    const kp = key.position.clone();
    scene.add(plane); setColor(false);
    const sd = shot();
    key.position.set(0.4, 10, 0.25); key.updateMatrixWorld();
    const sa = shot();
    key.position.copy(kp); key.updateMatrixWorld();
    scene.remove(plane); setColor(true);
    return [sd, sa];
  };
  const out = { W, H: Hh, anchor, N, autoInfo, scale: s, height: H, autoCut: autoCutFrac };
  if (opt.mode === 'tower') {
    // base (static) with a dark turret-ring cap over the cut
    setClip([new THREE.Plane(new THREE.Vector3(0, -1, 0), cutY)]);
    pivot.rotation.y = 0;
    let capR = opt.capR ?? 0.3;
    if (opt.capR === 'auto') {
      // the cut surface: radius of the turret ring at the cut height (80th percentile of the slice)
      const rs = collectVerts(pivot, (v) => Math.abs(v.y - cutY) < H * 0.025).map(v => Math.hypot(v.x, v.z)).sort((a, b) => a - b);
      capR = rs.length ? rs[Math.floor(rs.length * 0.8)] * 0.98 : 0.2;
    }
    const cap = new THREE.Mesh(new THREE.CircleGeometry(capR, 48), new THREE.MeshStandardMaterial({ color: opt.capColor ?? 0x2a2d31, metalness: 0.6, roughness: 0.55 }));
    cap.rotation.x = -Math.PI / 2; cap.position.y = cutY - 0.002; cap.receiveShadow = true;
    scene.add(cap);
    out.base = shot();
    scene.remove(cap);
    // turret frames
    const turretClip = [new THREE.Plane(new THREE.Vector3(0, 1, 0), -cutY)];
    setClip(turretClip);
    out.frames = []; out.muzzles = [];
    if (opt.shadow) out.shadows = [];
    for (let i = 0; i < N; i++) {
      const a = 2 * Math.PI * i / N;      // desired forward angle (atan2(z,x)) == grid angle atan2(dy,dx)
      pivot.rotation.y = yaw0 - a;
      pivot.updateMatrixWorld(true);
      out.frames.push(shot());
      if (opt.shadow) { setClip([]); out.shadows.push(shadowShots()); setClip(turretClip); }
      const mw = muzzle.clone().applyMatrix4(pivot.matrixWorld);
      const px = toPx(mw);
      out.muzzles.push([px[0] - anchor[0], px[1] - anchor[1]]);
    }
    setClip([]);
    out.cutPx = toPx(new THREE.Vector3(0, cutY, 0))[1] - anchor[1];
  } else if (opt.shadow) {
    // prop: model frames + separate shadow passes (key-light shadow, contact shadow from straight above)
    out.frames = []; out.shadows = [];
    for (let i = 0; i < N; i++) {
      pivot.rotation.y = yaw0 - 2 * Math.PI * i / N;
      pivot.updateMatrixWorld(true);
      out.frames.push(shot());
      out.shadows.push(shadowShots());
    }
    out.center = toPx(new THREE.Vector3(0, H * 0.5, 0)).map((v, k) => v - anchor[k]);
    out.top = toPx(new THREE.Vector3(0, H, 0)).map((v, k) => v - anchor[k]);
  } else {
    out.frames = [];
    const af = opt.anim ? opt.anim.frames : 1;
    for (let i = 0; i < N; i++) {
      const a = 2 * Math.PI * i / N;
      pivot.rotation.y = yaw0 - a;
      for (let k = 0; k < af; k++) {
        if (legs || deform) pose(k / af);
        else if (mixer) pose((k / af) * clip.duration);
        pivot.updateMatrixWorld(true);
        out.frames.push(shot());
      }
    }
    if (opt.anim) { out.af = af; out.clip = clip ? clip.duration : 0; if (mixer || legs || deform) pose(0); }
    if (rootVec) out.rootDist = Math.hypot(rootVec[0], rootVec[1]);
    // body centre (for aiming) in px relative to anchor
    out.center = toPx(new THREE.Vector3(0, H * 0.5, 0)).map((v, k) => v - anchor[k]);
    out.top = toPx(new THREE.Vector3(0, H, 0)).map((v, k) => v - anchor[k]);
  }
  return out;
};
window.ready = true;
</script>
</body>
</html>
